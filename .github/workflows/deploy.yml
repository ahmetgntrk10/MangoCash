name: Deploy Supabase (migrations + edge functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          set -e
          for i in 1 2 3; do
            if supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"; then
              echo "Linked on attempt $i"
              exit 0
            fi
            echo "Link attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::warning::supabase link failed after 3 attempts"

      - name: Repair migration history (mark existing as applied)
        continue-on-error: true
        run: |
          set +e
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            version="${base%%_*}"
            if [[ "$version" =~ ^[0-9]+$ ]]; then
              echo "Ensuring migration $version is marked applied..."
              supabase migration repair --status applied "$version" \
                --project-ref "$SUPABASE_PROJECT_ID" \
                --password "$SUPABASE_DB_PASSWORD" || true
            fi
          done
          exit 0

      - name: Push database migrations
        continue-on-error: true
        run: |
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" \
            || echo "::warning::supabase db push reported errors; continuing"

      - name: Deploy all edge functions
        run: |
          set +e
          succeeded=()
          failed=()
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ -f "$dir/index.ts" ]; then
              echo "::group::Deploying function: $name"
              if supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt; then
                succeeded+=("$name")
              else
                echo "::warning::Failed to deploy function: $name"
                failed+=("$name")
              fi
              echo "::endgroup::"
            fi
          done
          echo "Succeeded (${#succeeded[@]}): ${succeeded[*]}"
          echo "Failed   (${#failed[@]}): ${failed[*]}"
          exit 0
